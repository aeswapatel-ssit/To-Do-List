<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek GenZ Task Flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-card">
        <div class="header">
            <h2>Today's Flow ✨</h2>
            <p id="dateDisplay">Stay productive, stay chill.</p>
        </div>
        <div class="input-wrapper">
            <input type="text" id="taskInput" placeholder="Drop a new task here...">
            <button onclick="addTask()">Add</button>
        </div>
        <ul id="taskList">
            <!-- Dynamic tasks will be added here -->
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
